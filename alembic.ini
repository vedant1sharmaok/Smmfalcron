# Alembic configuration.
# migrations/env.py overrides sqlalchemy.url with DATABASE_URL from the
# environment, so the value here is only used for local dev without env vars.

[alembic]
script_location = migrations
file_template   = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone        = UTC
truncate_slug_length = 40
output_encoding = utf-8

# Local dev fallback — overridden by DATABASE_URL env var in production
sqlalchemy.url = postgresql+asyncpg://smm_app:dev@localhost:5432/smm_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format   = %(levelname)-5.5s [%(name)s] %(message)s
datefmt  = %H:%M:%S
