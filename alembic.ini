# Alembic configuration file.
# This file is required by the `alembic` CLI and must be in the
# working directory when migrations are run.
#
# In the Dockerfile, the working directory is /app, so this file
# must be copied there (see COPY alembic.ini ./ in Dockerfile).

[alembic]
# Location of the migration scripts relative to this file.
script_location = migrations

# Template for revision file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for revision timestamps.
timezone = UTC

# Truncate revision slug to this length.
truncate_slug_length = 40

# Output encoding for generated files.
output_encoding = utf-8

# ── SQLAlchemy URL ──────────────────────────────────────────────────────────
# This is overridden in migrations/env.py by reading settings.database_url,
# so the value here only matters if you run alembic outside the Docker image.
sqlalchemy.url = postgresql://smm_app:dev@localhost:5432/smm_platform


# ── Logging ─────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
