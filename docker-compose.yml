# Production stack: PostgreSQL + the app + Caddy (automatic HTTPS).
# Usage: cp .env.example .env  -> edit -> docker compose up -d --build   (see DEPLOY.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: falaron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: falaron
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falaron -d falaron"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://falaron:${POSTGRES_PASSWORD}@db:5432/falaron
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      TRUST_PROXY: "true"
    expose:
      - "8080"
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
